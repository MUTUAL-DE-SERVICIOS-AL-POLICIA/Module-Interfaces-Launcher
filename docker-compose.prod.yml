services:

  beneficiary-interface:
    build: 
      context: ./Beneficiary-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${BENEFICIARY_PORT}:${BENEFICIARY_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${BENEFICIARY_PORT}
      - HOSTNAME=0.0.0.0
    restart: always

  login-hub-interface:
    build: 
      context: ./Login-Hub-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${LOGIN_HUB_PORT}:${LOGIN_HUB_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${LOGIN_HUB_PORT}
      - HOSTNAME=0.0.0.0
    restart: always

  sales-interface:
    build: 
      context: ./Sales-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${SALES_PORT}:${SALES_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${SALES_PORT}
      - HOSTNAME=0.0.0.0
    restart: always

  collections-interface:
    build: 
      context: ./Collections-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${COLLECTIONS_PORT}:${COLLECTIONS_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${COLLECTIONS_PORT}
      - HOSTNAME=0.0.0.0
    restart: always