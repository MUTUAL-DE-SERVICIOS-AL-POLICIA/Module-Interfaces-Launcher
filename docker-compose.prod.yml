services:

  beneficiary-interface:
    build: 
      context: ./Beneficiary-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${NEXT_PUBLIC_BENEFICIARY_FRONTEND_PORT}:${NEXT_PUBLIC_BENEFICIARY_FRONTEND_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${NEXT_PUBLIC_BENEFICIARY_FRONTEND_PORT}
      - HOSTNAME=0.0.0.0
    restart: always

  login-hub-interface:
    build: 
      context: ./Login-Hub-Interface
      dockerfile: dockerfile.prod
    ports:
      - ${NEXT_PUBLIC_HUB_FRONTEND_PORT}:${NEXT_PUBLIC_HUB_FRONTEND_PORT}
    environment:
      - NODE_ENV=production
      - PORT=${NEXT_PUBLIC_HUB_FRONTEND_PORT}
      - HOSTNAME=0.0.0.0
    restart: always